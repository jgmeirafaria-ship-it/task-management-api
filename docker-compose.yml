services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@db:5432/taskdb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@db:5432/taskdb
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: